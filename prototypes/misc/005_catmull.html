<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title></title></head>
<style>canvas{ display:block; } body, html { padding:0px; margin:0px; width:100%; height:100%; }</style>
<body><script type="module">
// #region IMPORTS
import useThreeWebGL2, { THREE, useDarkScene, useVisualDebug } from '../_lib/useThreeWebGL2.js';
import useTransformControl          from '../_lib/useTransformControl.js';
import ScreenPicker, { Tasker }     from '../_lib/misc/ScreenPicker.js';
import ShapePointsMesh              from '../_lib/meshes/ShapePointsMesh.js';
// import Util                         from '../_lib/misc/Util.js';

import { CatmullRomSpline } from '../../src/maths/curves/index';

import { 
    Vec3, //Quat, Transform,
} from '../../src/maths/index';

// #endregion

// #region MAIN
let Debug;
let App = useDarkScene( useThreeWebGL2() );
let Ref = {
    pnts    : new ShapePointsMesh().forDebugging(),
    gizmo   : useTransformControl( App ).useAxes().hide(),
    picker  : new ScreenPicker( App ),
    tasks   : new Tasker(),
    selPnt  : -1,
};

window.addEventListener( 'load', async _=>{
    // ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
    // Setup
    App.sphericalLook( 20, 20, 4, [ 0, 0.8, 0 ] );
    Debug = await useVisualDebug( App );
    App.scene.add( Ref.pnts );

    // Ref.pnts
    //     .add( [0,1,0], 0x00ffff, 4, 6 )
    //     .add( [0,2,0], 0xffff00, 4, 6 );

    // ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~

    Ref.spline = new CatmullRomSpline();
    Ref.spline.appendCurve( [[-2,0,0], [-1,1,0], [0,0,0], [2,0,0]] );
    Ref.spline.appendCurve( [[1,1,0],[1.5,1,0]] );

    // console.log( Ref.spline.points );
    // console.log( Ref.spline.curves );

    Ref.spline.alignEndPoints( 0.2 );

    // renderSpline( Ref.spline );
    renderCurves( Ref.spline );

    // ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
    App.createRenderLoop( null, onPostRender ).start();
    // App.renderLoop();
});

Ref.gizmo.onMove = pos=>{
    if( Ref.selPnt === -1 ) return;
    // Ref.pnts.setPosAt( Ref.selPnt, pos );
    Ref.spline.points[ Ref.selPnt ].pos.copy( pos );
    // renderSpline( Ref.spline );
    renderCurves( Ref.spline );
};

function onPreRender( dt, et ){}
function onPostRender( dt, et ){ Ref.tasks.run(); }

window.addEventListener( 'pointerdown', e=>{
    if( e.button === 2 ){
        Ref.gizmo.hide();
        Ref.selPnt = -1;
        return;
    }

    if( Ref.gizmo.o.dragging ) return;
    Ref.tasks.push( Ref.picker.pixelTaskFromEvent(e, onPicker, false) );
});

function onPicker( o ){
    // console.log( 'Pick', o );
    // if( o.id === -1 || o.type !== "shapePoint" ) return;
    if( o.id === -1 || o.obj !== Ref.pnts ) return;
    // console.log( 'Pick', o );
    Ref.gizmo.show( o.hit );
    Ref.selPnt = o.idx;
}
// #endregion


function renderSpline( spline, samples=10 ){
    // ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
    Ref.pnts.reset();
    for( let p of spline.points ){
        const c = p.type === 1 ? 0x808080 : 0x00ff00;
        Ref.pnts.add( p.pos, c, 3 );
    }

    // ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
    Debug.reset();
    const prev = new Vec3();
    const curr = new Vec3();
    const s    = samples - 1;
    let t;
    
    spline.at( 0, prev );
    for( let i=1; i <= s; i++ ){
        t = i / s;
        spline.at( t, curr );
        Debug.ln.add( prev, curr, 0x808080 );
        prev.copy( curr );
    }
}

function renderCurves( spline, samples=6 ){
    // ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
    Ref.pnts.reset();
    for( let p of spline.points ){
        const c = p.type === 1 ? 0x808080 : 0x00ff00;
        Ref.pnts.add( p.pos, c, 3 );
    }

    // ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
    Debug.reset();
    const prev = new Vec3();
    const curr = new Vec3();
    const tan  = new Vec3()
    const norm = new Vec3()
    const s    = samples - 1;
    let scl    = 0.15;
    let t;

    spline.atCurve( 0, 0, prev, tan, norm );
    Debug.ln.add( prev, tan.norm().scale(scl).add(prev), 0xffa000 );
    Debug.ln.add( prev, norm.norm().scale(scl).add(prev), 0xffffff );

    for( let ci=0; ci < spline.curveCount; ci++ ){
        for( let i=1; i <= s; i++ ){
            t = i / s;
            spline.atCurve( ci, t, curr, tan, norm );
            Debug.pnt.add( curr, 0xffa000, 1 );
            Debug.ln.add( prev, curr, 0x808080 );
            Debug.ln.add( curr, tan.norm().scale(scl).add(curr), 0xffa000 );
            Debug.ln.add( curr, norm.norm().scale(scl).add(curr), 0xffffff );

            prev.copy( curr );
        }
    }
}
</script></body></html>
