class IKSplineTarget{
    spline      = null;
    pworld      = new Transform();  // Parent Bone WS Transform
    rworld      = new Transform();  // Root Bone WS Transform

    swing       = new Vec3();
    twist       = new Vec3();
    dist        = 0;                // Distance from Origin & Target Position

    twistRadA   = 0;                // Apply extra twist to start of spline
    twistRadB   = 0;                // Apply extra twist to end of spline

    constructor( spline ){
        this.spline = spline;
    }

    setTargetPos( v ){ this.spline.points.at(-1).setPos( v ); return this; }
    setPos( i, v ){ this.spline.setPos( i, v ); return this; }

    get endPos(){ return this.spline.points.at(-1).pos; }
    get startPos(){ return this.spline.points[0].pos; }

    resolveTarget( chain, pose ){
        const sp = this.spline;

        // ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
        // Get the World transform to the root's parent bone of the chain
        pose.getWorldTransform( chain.links[0].pindex, this.pworld );

        // Then add bone's LS bind transform to get its current unmodified world transform
        this.rworld.fromMul( this.pworld, chain.links[0].bind );

        // Set root's position as the start of the curve
        sp.points[0].setPos( this.rworld.pos );

        // ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
        // Compute ik direction & dist
        const aPnt = sp.points[0];
        const bPnt = sp.points.at( -1 );

        this.swing.fromSub( bPnt.pos, aPnt.pos );
        this.dist = this.swing.len;
        this.swing.norm();

        // HACK - this won't work for all splines as there is no defined pole position in a spline
        // Twist is needed by look solver when target is beyond reach
        const v = new Vec3().fromSub( sp.points[0].pos, sp.points[1].pos ).norm();
        this.twist.fromReflect( v, this.swing );        // Refective vector as it should work better in this case to compute a pole vector
        v.fromCross( this.twist, this.swing );          // Start orthogonal fix
        this.twist.fromCross( this.swing, v ).norm();   // Realign twist to be ortho to swing
    }
}

function splineSolver( tar, chain, pose, opts={} ){
    // if( tar.dist >= chain.len ) console.log( 'Target is out of reach')

    // ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
    // Sample Spline
    const sampler = new SplineSampler()
        .fromSpline( tar.spline, chain.links.length * 2 );

    // -----------------------------
    // Transport the twist direction across samples
    const v = new Vec3();
    v.fromQuat( tar.rworld.rot, chain.links[0].axes.twist ); 
    
    Rmf.transportNormal( sampler.items, v );

    // -----------------------------
    // Apply additional twisting to samples if available
    if( tar.twistRadA !== 0 && tar.twistRadB !== 0 ){
        Rmf.applyLinearTwist( sampler.points, tar.twistRadA, tar.twistRadB );
    }

    // ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
    // Get sample for each link
    const points = new Array();
    let travel = 0;
    let overSample; // ?: SplineSample;

    // -------------------------------
    // Create samples for each joint in the change
    for( const lnk of chain.links ){
        if( travel > sampler.arcLength ){
            // UseCase: Handle when curve is shorter then chain
            if( !overSample ){              
                // Clone last sample, set its position to the end
                // of the curve then adjust tangent & fix normal  
                const prev = points.at(-1);
                overSample = prev.clone();

                overSample.pos.copy( sampler.items.at(-1).pos );
                overSample.tangent
                    .fromSub( overSample.pos, prev.pos )
                    .norm();

                Rmf.fixOrthogonal( overSample );
                points.push( overSample );

            }else{
                // More joints outside the curve, clone the overshoot
                // sample. Then shift its position by its tangent.
                // All joints after first overshoot will have the same
                // orientation.
                const next = overSample.clone();
                v.fromScale( overSample.tangent, lnk.len );
                next.pos.add( v );
                points.push( next );
            }
            console.log( 'Link is passed arcLength', lnk );
        }else{
            points.push( sampler.atDist( travel ) );
        }

        travel += lnk.len;
    }

    // -------------------------------
    // UseCase: When chain is shorter then spline
    if( travel <= sampler.arcLength ){
        console.log( 'UNDERSHOOT' );

        // Project the world position of the last joint
        const al = chain.links.at( -3 );
        const a  = points.at( -3 );
        const b  = points.at( -2 );
    
        b.pos.fromSub( b.pos, a.pos )
            .norm()
            .scale( al.len )
            .add( a.pos );

        // Last point should point to end of curve
        // This will make the last joint aim toward
        // the target pos after realigning all tangents
        const e = points.at( -1 );  // End Point
        e.pos.copy( tar.endPos );
        console.log( opts );
        if( opts.useReach ){
            iterateForward( tar, chain, points );
            iterateBackward( chain, points );
        }
    }

    // -------------------------------
    // Do a pass to apply corrections to tangents
    // since lerping by distance creates discontinuity
    Rmf.realignTangentsFromPoints( points );

    // ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
    applySamplesToPose( chain, pose, points );

    v.copy( points[0].pos );
    for( const p of sampler.items ){
        Debug.ln.add( v, p.pos, 0xffa000 );
        v.copy( p.pos );
    }
    for( const p of points ){
        Debug.pnt.add( p.pos, 0xffa000, 2 );
        Debug.ln.add( p.pos, v.fromScaleThenAdd( 0.15, p.normal, p.pos), 0xffa000 );
    }

    // for( const samp of points ){
    //     Debug.pnt.add( samp.pos, 0x00ff00, 2 );
    //     Debug.ln.add( samp.pos, v.fromScaleThenAdd( 0.9, samp.tangent, samp.pos ), 0xffff00 );
    //     Debug.ln.add( samp.pos, v.fromScaleThenAdd( 0.5, samp.normal, samp.pos ), 0xff00ff );
    // }

    // const v = new Vec3();
    // for( const i of samp.items ){
    //     Debug.pnt.add( i.pos, 0x00ff00, 3 );
    //     Debug.ln.add( i.pos, v.fromScaleThenAdd( 0.5, i.tangent, i.pos ), 0xffff00 );
    // }

    // const eIdx = 9;
    // let prev = samp.atDist( 0 );
    // Debug.ln.add( prev.pos, v.fromScaleThenAdd( 0.3, prev.normal, prev.pos ), 0xffff00 );
    // for( let i=1; i <=eIdx; i++ ){
    //     const c = samp.atDist( samp.arcLength * ( i / eIdx ) );
    //     prev = c;
    //     Debug.pnt.add( c.pos, 0x00ff00, 3 );
    //     // Debug.ln.add( c.pos, v.fromScaleThenAdd( 2, c.tangent, c.pos ), 0xffff00 );
    //     Debug.ln.add( c.pos, v.fromScaleThenAdd( 0.3, c.normal, c.pos ), 0xffff00 );
    // }
}

function applySamplesToPose( chain, pose, pnts ){
    const parent  = new Transform();
    const fromDir = new Vec3();
    const sRot    = new Quat();
    let lnk;
    let joint;

    // const v = new Vec3();

    for( let i=0; i < chain.links.length-1; i++ ){
        lnk   = chain.links[ i ];
        joint = pose.getBone( lnk.index );
        
        // ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
        // Joints unchanged ws transform
        pose.getWorldTransform( joint.pindex, parent );
        joint.world.fromMul( parent, lnk.bind );

        // Debug.pnt.add( joint.world.pos, 0x00ff00, 3, 0 );

        // ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
        // SWING
        // Direction bone is pointing toward
        fromDir.fromQuat( joint.world.rot, lnk.axes.swing ).norm();
        // Debug.ln.add( joint.world.pos, v.fromScaleThenAdd( 1, fromDir, joint.world.pos ), 0xffff00 );
        // Debug.ln.add( joint.world.pos, v.fromScaleThenAdd( 1, pnts[i].tangent, joint.world.pos ), 0xff00ff );
        
        // Direction toward target point
        // toDir.fromSub( pnts[i+1], bone.world.pos ).norm();

        sRot
            .fromSwing( fromDir, pnts[i].tangent )  // Rotation FROM > TO
            .mul( joint.world.rot )                  // Apply to WS Rotation of bone

        // ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
        // TWIST + Finalize
        fromDir.fromQuat( sRot, lnk.axes.twist ).norm();
        // tRot.fromSwing( fromDir, pnts[i].normal );

        joint.local.rot
            .fromSwing( fromDir, pnts[i].normal ) // Create Twist
            .mul( sRot )                          // Apply Swing
            .pmulInvert( parent.rot )             // To Local Space
            .norm();                              // To unit quaternion

        // Debug.ln.add( joint.world.pos, v.fromScaleThenAdd( 1, fromDir, joint.world.pos ), 0xffff00 );
        // Debug.ln.add( joint.world.pos, v.fromScaleThenAdd( 0.5, pnts[i].normal, joint.world.pos ), 0xff00ff );
    }
}

function splineCompose( target, chain, pose, opts={} ){
    const props = Object.assign( {
        useReach : false,   // Allow use of Fwd & Back to try to reach target when applicable
    }, opts );

    console.log( opts )


    // Resolve the target to the current pose data
    target.resolveTarget( chain, pose );

    // If the target is to far away, straighten the chain
    if( target.dist >= chain.len ){
        // Align the the root bone to the target direction
        lookSolver( target, chain, pose );
        chain.resetPoseLocal( pose, 1 );
    }else{
        splineSolver( target, chain, pose, props );
    }

    pose.updateWorld();
}

// Move points torward the target point
function iterateForward( tar, chain, pnts ){
    const v = new Vec3();
    pnts.at( -1 )?.pos.copy( tar.endPos );      // Move last point to target position

    for( let i = chain.links.length-1; i > 1; i-- ){
        v   .fromSub( pnts[i-1].pos, pnts[i].pos )  // Direction to parent point
            .norm()
            .scale( chain.links[ i-1 ].len )        // Resize to bone's length
            .add( pnts[i].pos )                     // Move away from child
            .copyTo( pnts[i-1].pos );               // Save result back as parent position
    }
}

// Move points toward the origin point
function iterateBackward( chain, pnts ){
    const v = new Vec3();
    for( let i = 0; i < chain.links.length-1; i++ ){
        v   .fromSub( pnts[i+1].pos, pnts[i].pos )  // Direction to child point
            .norm()
            .scale( chain.links[ i ].len )          // Resize to bone's length
            .add( pnts[i].pos )                     // Move away from parent
            .copyTo( pnts[i+1].pos );               // Save result back as child position
    }
}
