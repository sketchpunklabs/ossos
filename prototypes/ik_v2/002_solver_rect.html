function createTestChain( cnt=3, step=0.5 ){
    const arm = new Armature();
    let prev  = null;

    for( let i=0; i < cnt; i++ ) prev = arm.addBone( { name:`b${i}`, pos:[0,step,0], parent:prev } );

    // arm.bind( step );
    arm.bind( 0.001 );
    return arm;
}

function createTestChainByLengths( ary ){
    const arm = new Armature();
    let prev  = null;

    for( let i=0; i < ary.length; i++ ) 
        prev = arm.addBone( { 
            name    :`b${i}`, 
            pos     :[0, (!i?0:ary[i-1]), 0], 
            parent  :   prev 
        } );

    // arm.bind( step );
    arm.bind( ary.at( -1 ) );
    return arm;
}

function createBoxChain( cnt=3 ){
    const rtn = [];

    for( let i=0; i < cnt; i++ ){
        const c = facedCube();
        c.scale.setScalar( 0.1 );
        rtn.push( c );
        App.scene.add( c );
    }

    return rtn;
}

function poseCubes( pose, offset=[0,0,0] ){
    for( const b of Ref.pose.bones ){
        const c = Ref.cubes[ b.index ];
        c.quaternion.fromArray( b.world.rot );
        c.position.fromArray( b.world.pos );
        c.position.x += offset[0];
        c.position.y += offset[1];
        c.position.z += offset[2];
    }
}

function calculateCircularArcAngles(bone1Length, bone2Length, bone3Length, targetDistance) {
  // Ensure all lengths are positive.
  if (bone1Length <= 0 || bone2Length <= 0 || bone3Length <= 0 || targetDistance <= 0) {
    return null; // Invalid input.
  }

  // Calculate the total arc length.
  const arcLength = bone1Length + bone2Length + bone3Length;

  // Approximate the radius.
  const approxRadius = arcLength / (2 * Math.PI);

    // Calculate the central angle subtended by the target distance (chord).
  const centralAngle = 2 * Math.asin(targetDistance / (2 * approxRadius));

  // Calculate the angles subtended by each bone.
  const angle1 = 0; // Bone1 is the reference.
  const angle2 = centralAngle * (bone2Length / arcLength);
  const angle3 = centralAngle;
  const angle4 = centralAngle * (bone2Length / arcLength);

  return {
    angle1: angle1,
    angle2: angle2,
    angle3: angle3,
    angle4: angle4,
  };
}

function calculateSkewedRectangleAngles2(bone1Length, bone2Length, bone3Length, targetDistance) {
  // Ensure all lengths are positive.
  if (bone1Length <= 0 || bone2Length <= 0 || bone3Length <= 0 || targetDistance <= 0) {
    return null; // Invalid input.
  }

  // Triangle 1 (bone1, targetDistance, diagonal1)
  const diagonal1 = Math.sqrt(bone1Length * bone1Length + targetDistance * targetDistance);
  const angleA1 = Math.acos((bone1Length * bone1Length + diagonal1 * diagonal1 - targetDistance * targetDistance) / (2 * bone1Length * diagonal1));
  const angleA2 = Math.acos((targetDistance * targetDistance + diagonal1 * diagonal1 - bone1Length * bone1Length) / (2 * targetDistance * diagonal1));

  // Triangle 2 (bone1, bone2, diagonal2)
  const diagonal2 = Math.sqrt(bone1Length * bone1Length + bone2Length * bone2Length - 2 * bone1Length * bone2Length * Math.cos(Math.PI/2));
  const angleB1 = Math.acos((bone1Length * bone1Length + diagonal2 * diagonal2 - bone2Length * bone2Length) / (2 * bone1Length * diagonal2));
  const angleB2 = Math.acos((bone2Length * bone2Length + diagonal2 * diagonal2 - bone1Length * bone1Length) / (2 * bone2Length * diagonal2));

  // Triangle 3 (bone2, bone3, diagonal3)
  const diagonal3 = Math.sqrt(bone2Length * bone2Length + bone3Length * bone3Length);
  const angleC1 = Math.acos((bone2Length * bone2Length + diagonal3 * diagonal3 - bone3Length * bone3Length) / (2 * bone2Length * diagonal3));
  const angleC2 = Math.acos((bone3Length * bone3Length + diagonal3 * diagonal3 - bone2Length * bone2Length) / (2 * bone3Length * diagonal3));

  // Corner angles (in radians)
  const angle1 = angleA1;
  const angle4 = angleB1 + Math.PI/2;
  const angle2 = angleC1 + Math.PI/2;
  const angle3 = angleC2;

  return {
    angle1: angle1,
    angle2: angle2,
    angle3: angle3,
    angle4: angle4,
  };
}

function calculateArcAnglesSinc(bone1Length, bone2Length, bone3Length, targetDistance) {
  // Ensure all lengths are positive.
  if (bone1Length <= 0 || bone2Length <= 0 || bone3Length <= 0 || targetDistance <= 0) {
    return null; // Invalid input.
  }

  // Calculate arc length (a) and target distance (b).
  const a = bone1Length + bone2Length + bone3Length;
  const b = targetDistance;

  // Function to calculate sinc(x) - b/a.
  const sincDiff = (x) => Math.sin(x) / x - b / a;

  // Numerical solution using the bisection method.
  let low = 0;
  let high = Math.PI; // Maximum possible angle.
  let x = (low + high) / 2;
  const tolerance = 1e-6; // Tolerance for convergence.
  let iteration = 0;
  const maxIterations = 100;

  while (Math.abs(sincDiff(x)) > tolerance && iteration < maxIterations) {
    if (sincDiff(x) * sincDiff(low) < 0) {
      high = x;
    } else {
      low = x;
    }
    x = (low + high) / 2;
    iteration++;
  }

  if(iteration >= maxIterations){
      return null;
  }

  // Calculate bone angles.
  const angle1 = 0; // Bone1 is the reference.
  const angle2 = x * (bone2Length / a);
  const angle3 = x;
  const angle4 = x * (bone2Length / a);

  return {
    angle1: angle1,
    angle2: angle2,
    angle3: angle3,
    angle4: angle4,
  };
}


function asinc(x0) {
  let x = 6 * (1 - x0);
  let x1 = x;
  let a = x;
  x *= x1;
  a += x / 20.0;
  x *= x1;
  a += x * 2.0 / 525.0;
  x *= x1;
  a += x * 13.0 / 37800.0;
  x *= x1;
  a += x * 4957.0 / 145530000.0;
  x *= x1;
  a += x * 58007.0 / 16216200000.0;
  x *= x1;
  a += x * 1748431.0 / 4469590125000.0;
  x *= x1;
  a += x * 4058681.0 / 92100645000000.0;
  x *= x1;
  a += x * 5313239803.0 / 1046241656460000000.0;
  x *= x1;
  a += x * 2601229460539.0 / 4365681093774000000000.0;
  return Math.sqrt(a);
}

function calculateArcAnglesSinc2(bone1Length, bone2Length, bone3Length, targetDistance) {
  // Ensure all lengths are positive.
  if (bone1Length <= 0 || bone2Length <= 0 || bone3Length <= 0 || targetDistance <= 0) {
    return null; // Invalid input.
  }

  // Calculate arc length (a) and target distance (b).
  const a = bone1Length + bone2Length + bone3Length;
  const b = targetDistance;

  // Calculate x (angle).
  const x = asinc( b / a );

  // Calculate bone angles.
  const angle1 = 0; // Bone1 is the reference.
  const angle2 = x * (bone2Length / a);
  const angle3 = x;
  const angle4 = x * (bone1Length / a);

  return {
    angle1: angle1,
    angle2: angle2,
    angle3: angle3,
    angle4: angle4,
  };
}

function calculateBoneRotations(boneLengths, targetDistance) {
  // Ensure all bone lengths are positive and target distance is valid.
  if (!Array.isArray(boneLengths) || boneLengths.length < 2 || targetDistance <= 0) {
    return null; // Invalid input.
  }

  if (boneLengths.some(length => length <= 0)) {
    return null;
  }

  // Calculate total arc length.
  const arcLength = boneLengths.reduce((sum, length) => sum + length, 0);

  // Calculate b/a (targetDistance/arcLength).
  const x0 = targetDistance / arcLength;

  // Calculate x (angle).
  const x = asinc(x0);

  // Calculate bone angles.
  const boneAngles = [];

  for (let i = 0; i < boneLengths.length; i++) {
    boneAngles.push(x * (boneLengths[i] / arcLength));
  }

  return boneAngles;
}
